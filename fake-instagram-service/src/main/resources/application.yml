server:
  port: ${SIMULATOR_PORT:8085}

spring:
  application:
    name: fake-instagram-simulator
  datasource:
    url: jdbc:h2:file:./data/fakeinstagramdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: FakeInstagramHikariPool
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.fakeinstagram: INFO
    org.springframework.web: WARN
