spring:
  datasource:
    url: jdbc:h2:file:./data/instamngmtdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.instamngmt: DEBUG
    org.springframework.security: INFO

instagram:
  graph-api-base-url: https://graph.facebook.com

